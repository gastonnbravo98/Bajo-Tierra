<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bajo Tierra</title>
  <style>
    :root {
      --panel: rgba(34, 21, 14, 0.82);
      --panel-border: #7a4e2d;
      --text: #f3e3c8;
      --muted: #b89c7a;
      --gold: #ffcf5a;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }

    /* Menú */
    #menu {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #111; color: #eee; font-family: sans-serif;
    }
    #menu h1 { margin: 0; font-size: 56px; letter-spacing: 2px; }
    #menu p { margin: 0; color: #aaa; text-align: center; max-width: 560px; }
    #menu input {
      width: 260px; padding: 10px; font-size: 16px; text-align: center;
      background: #222; color: #eee; border: 1px solid #555; border-radius: 4px;
    }
    #menu button {
      width: 280px; padding: 12px; font-size: 20px; cursor: pointer;
      background: #2e9e4f; color: #fff; border: none; border-radius: 4px;
    }
    #menu button:hover { background: #38b95e; }

    /* HUD y panel de debug */
    #hud, #debug {
      display: none; position: fixed; z-index: 5; padding: 8px 12px;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--panel-border); border-radius: 6px;
      font: 14px/1.5 monospace; white-space: pre; pointer-events: none;
    }
    #hud { top: 12px; left: 12px; }
    #debug { bottom: 12px; left: 12px; font-size: 12px; line-height: 1.45; max-width: 70vw; overflow: hidden; }

    /* Minimapa: normal a la derecha, la tecla M lo agranda */
    #minimap {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      width: min(400px, 40vw); image-rendering: pixelated;
      border: 2px solid rgba(255, 255, 255, 0.6); background: #000; pointer-events: none;
    }
    #minimap.big { width: min(900px, 70vw); opacity: 0.94; }

    /* Aviso de meta */
    #banner {
      display: none; position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      z-index: 6; padding: 14px 26px; border-radius: 6px; pointer-events: none;
      background: var(--panel); border: 2px solid var(--gold); color: var(--gold);
      font: 600 22px sans-serif; text-align: center;
    }

    /* Tienda */
    #shop {
      display: none; position: fixed; right: 12px; bottom: 12px; z-index: 7; width: 340px;
      padding: 14px; background: var(--panel); color: var(--text);
      border: 1px solid var(--panel-border); border-radius: 6px; font-family: sans-serif;
    }
    #shop h2 { margin: 0 0 4px; font-size: 22px; }
    #shop .shop-money { margin: 0 0 10px; color: var(--gold); font-weight: 600; }
    #shop .shop-hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    #shop button {
      display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; width: 100%;
      margin-bottom: 6px; padding: 8px 10px; text-align: left; cursor: pointer;
      background: #4a2f1c; color: var(--text); border: 1px solid var(--panel-border); border-radius: 4px;
      font: 15px sans-serif;
    }
    #shop button small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
    #shop button strong { color: var(--gold); }
    #shop button:hover:not(:disabled) { background: #6a4326; }
    #shop button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #shop button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="menu">
    <h1>Bajo Tierra</h1>
    <p>Cavá, juntá minerales, vendelos en la tienda y mejorá tu equipo para llegar cada vez más hondo</p>
    <input id="seed-input" type="text" placeholder="Seed (vacío = aleatoria)" autocomplete="off" maxlength="30">
    <button id="play-btn">Jugar</button>
    <p id="last-seed"></p>
    <p>A/D mover · Espacio saltar (mantené en el aire para volar) · Click izquierdo cavar · Click derecho dinamita · E tienda · M minimapa grande · U depuración · Esc menú</p>
  </div>
  <div id="hud"></div>
  <div id="debug"></div>
  <div id="shop"></div>
  <div id="banner"></div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
